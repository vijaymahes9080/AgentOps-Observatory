name: AgentOps Observatory CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pydantic-settings sqlalchemy aiosqlite pytest pytest-asyncio httpx pyjwt passlib ruff

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run Pytest Test Suite
        run: |
          export PYTHONPATH=.
          pytest tests/ -v

      - name: Run Benchmark Evaluation Suite
        run: |
          export PYTHONPATH=.
          python -m evaluation.evaluator

      - name: Run Ingestion Performance Load Test
        run: |
          export PYTHONPATH=.
          python scripts/load_test.py

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build
